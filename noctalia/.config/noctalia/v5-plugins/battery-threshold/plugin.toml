id = "dominik/battery-threshold"
name = "Battery Threshold"
version = "0.2.1"
plugin_api = 3
author = "dominik"
license = "MIT"
tags = ["bar", "panel", "service", "battery", "power"]
icon = "battery-eco"
description = "Discover and manage UPower battery charge thresholds on supported laptops."
dependencies = ["busctl", "upower", "pkexec", "python", "systemctl", "systemd-hwdb", "udevadm"]

[[setting]]
key = "poll_interval_ms"
type = "int"
label_key = "settings.poll_interval_ms.label"
description_key = "settings.poll_interval_ms.description"
default = 5000
min = 1000
max = 60000

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 480
height = 600
placement = "attached"
open_near_click = true

[[widget]]
id = "widget"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "battery-eco"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = true
